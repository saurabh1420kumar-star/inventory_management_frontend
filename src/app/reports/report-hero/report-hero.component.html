<ion-header class="ion-no-border">
  <ion-toolbar class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
    <ion-buttons slot="start">
      <ion-menu-button class="text-slate-600 hover:text-emerald-500 transition-colors"></ion-menu-button>
    </ion-buttons>
    <ion-title class="text-slate-800 font-bold tracking-tight text-xl">
      <span *ngIf="toolbarAccent" class="text-emerald-500">{{ toolbarAccent }}</span> {{ toolbarTitle }}
    </ion-title>
    <ion-buttons slot="end">
      <span *ngIf="lastUpdated" class="hidden sm:inline text-[0.65rem] text-slate-400 mr-2">Updated {{ lastUpdated | date:'d MMM, h:mm a' }}</span>
      <ion-button (click)="refresh.emit()" [disabled]="isBusy" fill="clear">
        <ion-icon slot="icon-only" name="refresh-outline" class="text-slate-500" [class.animate-spin]="isBusy"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-slate-50">
  <div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-emerald-50/20 pb-16">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 py-4 sm:py-6">

      <div class="bg-gradient-to-r from-emerald-500 via-teal-500 to-blue-600 rounded-2xl shadow-xl overflow-hidden mb-5 relative">
        <div class="absolute inset-0 opacity-15" style="background-image: radial-gradient(circle at 85% 15%, #ffffff 0%, transparent 45%), radial-gradient(circle at 5% 85%, #a7f3d0 0%, transparent 40%);"></div>
        <div class="relative px-5 py-5 flex items-center gap-4">
          <div class="hidden sm:flex w-12 h-12 rounded-xl bg-white/15 border border-white/25 items-center justify-center flex-shrink-0">
            <ion-icon [name]="icon" class="text-white text-2xl"></ion-icon>
          </div>
          <div>
            <p class="text-emerald-100 text-xs font-semibold uppercase tracking-widest mb-1">{{ eyebrow }}</p>
            <h1 class="text-white text-xl sm:text-2xl font-bold tracking-tight leading-tight drop-shadow-sm">{{ heroTitle }}</h1>
            <p *ngIf="subtitle" class="text-emerald-100 text-xs mt-1">{{ subtitle }}</p>
          </div>
        </div>
      </div>

      <ng-content></ng-content>
    </div>
  </div>
</ion-content>
